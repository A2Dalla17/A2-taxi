# ============================================================================
# AC7 Ride — Supabase override
# ----------------------------------------------------------------------------
# Points every service at Supabase instead of the local Postgres container.
# Redis, NATS and Kong still run locally — Supabase supplies Postgres only.
#
#   docker compose --env-file backend/.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.supabase.yml \
#     up -d
#
# `--env-file backend/.env` is NOT optional. Compose loads `.env` from the
# project directory, so without the flag the interpolations below fail with
# "required variable DB_USER is missing a value".
#
# No secret is written into this file — see backend/.env.supabase.example.
#
# NOTE: no application code changes accompany this. Supabase is PostgreSQL;
# the pgx driver, the repositories and all 24 migrations work unchanged.
# ============================================================================

x-supabase-db: &supabase-db
  DB_HOST: ${DB_HOST:?set DB_HOST in backend/.env}
  DB_PORT: ${DB_PORT:-6543}
  DB_USER: ${DB_USER:?set DB_USER in backend/.env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env}
  DB_NAME: ${DB_NAME:-postgres}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-8}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}

services:
  # The local database is no longer the target. Left defined but scaled to
  # zero via a profile so `docker compose down` still tidies up cleanly.
  postgres:
    profiles: ['local-db']

  auth-service:
    environment: *supabase-db
    depends_on: !reset []

  rides-service:
    environment: *supabase-db
    depends_on: !reset []

  geo-service:
    environment: *supabase-db
    depends_on: !reset []

  payments-service:
    environment: *supabase-db
    depends_on: !reset []

  notifications-service:
    environment: *supabase-db
    depends_on: !reset []

  realtime-service:
    environment: *supabase-db
    depends_on: !reset []

  mobile-service:
    environment: *supabase-db
    depends_on: !reset []

  admin-service:
    environment: *supabase-db
    depends_on: !reset []

  promos-service:
    environment: *supabase-db
    depends_on: !reset []

  scheduler-service:
    environment: *supabase-db
    depends_on: !reset []

  analytics-service:
    environment: *supabase-db
    depends_on: !reset []

  fraud-service:
    environment: *supabase-db
    depends_on: !reset []

  ml-eta-service:
    environment: *supabase-db
    depends_on: !reset []
